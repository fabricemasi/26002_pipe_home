    <span>F:\PIPELINE\NOTES\Fichier TEST.mro</span>
    <span style="color: #c9d1d9">{{status}}</span>
  </div>
</div>
</x-dc>

    });
    var key = JSON.stringify(touch);
    if (key !== this.touchKey) { this.touchKey = key; this.setState({ touch: touch }); }
  }

  /* ---------- barre : déplacement ---------- */
  onBarDown(id, e) {
    if (e.button !== 0 || e.ctrlKey || e.metaKey || !this.ws) return;
    e.preventDefault();
    var g = this.geom();
    var el = e.currentTarget.closest('[data-bar-id]');
    var r = this.rectOf(g, el);
    var p = this.local(g, e.clientX, e.clientY);
    var bars = this.state.bars;
    var others = Array.prototype.slice.call(this.ws.querySelectorAll('[data-bar-id]'))
      .filter((o) => o.getAttribute('data-bar-id') !== id)
      .map((o) => {
        var b = bars.find((x) => x.id === o.getAttribute('data-bar-id'));
        var q = this.rectOf(g, o); q.dock = b ? b.dock : null; return q;
      });
    var bar = bars.find((b) => b.id === id);
    var orient = this.orientOf(bar);
    this.drag = { id: id, offX: p.x - r.x, offY: p.y - r.y, w: r.w, h: r.h, W: g.W, H: g.H, others: others, orient: orient, snap: null };
    var snap = this.computeSnap(r.x, r.y);
    this.drag.snap = snap;
    this.setState({ drag: { id: id, dock: snap.dock, along: snap.along, x: snap.x, y: snap.y }, snapLine: snap.line });
  }

  sizeFor(orient) {
    var d = this.drag;
    return orient === d.orient ? { w: d.w, h: d.h } : { w: d.h, h: d.w };
  }

  computeSnap(x, y) {
    var d = this.drag, T = this.snapDist(), w = d.w, h = d.h;
    x = clamp(x, 0, Math.max(0, d.W - w));
    y = clamp(y, 0, Math.max(0, d.H - h));
    var dist = { top: y, left: x, right: d.W - (x + w), bottom: d.H - (y + h) };
    var edge = null, best = T;
    Object.keys(dist).forEach((k) => { if (dist[k] < best) { best = dist[k]; edge = k; } });
    if (edge) {
      var horiz = edge === 'top' || edge === 'bottom';
      var sz = this.sizeFor(this.dockOrient(edge));
      var len = horiz ? sz.w : sz.h, max = Math.max(0, (horiz ? d.W : d.H) - len);
      var cands = [0, max];
      // toute barre présente dans la bande de ce bord (clipsée ici, sur un bord voisin, ou flottante)
      d.others.forEach((o) => {
        var inBand = edge === 'top' ? o.y < sz.h
          : edge === 'bottom' ? o.y + o.h > d.H - sz.h
          : edge === 'left' ? o.x < sz.w
          : o.x + o.w > d.W - sz.w;
        if (!inBand) return;
        if (horiz) cands.push(o.x + o.w, o.x - len); else cands.push(o.y + o.h, o.y - len);
      });
      var along = clamp(snapTo(horiz ? x : y, cands, T), 0, max);
      var line = {
        top: 'left: 0; top: 0; width: 100%; height: 3px;',
        bottom: 'left: 0; bottom: 0; width: 100%; height: 3px;',
        left: 'left: 0; top: 0; width: 3px; height: 100%;',
        right: 'right: 0; top: 0; width: 3px; height: 100%;'
      }[edge];
      return { dock: edge, along: along, x: x, y: y, line: line };
    }
    var xs = [], ys = [];
    d.others.forEach((o) => {
      var vOver = y < o.y + o.h && y + h > o.y;
      var hOver = x < o.x + o.w && x + w > o.x;
      var hDock = o.dock === 'top' || o.dock === 'bottom';
      var vDock = o.dock === 'left' || o.dock === 'right';
      // barre clipsée : seuls ses deux côtés le long du bord sont aimantables
      // (pas de face intérieure, pas d'alignement perpendiculaire au bord)
      if (vOver && !vDock) xs.push(o.x + o.w, o.x - w);
      if (hOver && !hDock) ys.push(o.y + o.h, o.y - h);
      if (!vDock) xs.push(o.x, o.x + o.w - w);
      if (!hDock) ys.push(o.y, o.y + o.h - h);
    });
    var sx = clamp(snapTo(x, xs, T), 0, d.W - w), sy = clamp(snapTo(y, ys, T), 0, d.H - h);
    // contact : avec une barre clipsée → la barre se clipse sur le même bord ; sinon trait de contact
    var cl = null, dockTo = null;
    d.others.forEach((o) => {
      if (cl || dockTo) return;
      var y0 = Math.max(sy, o.y), y1 = Math.min(sy + h, o.y + o.h);
      var x0 = Math.max(sx, o.x), x1 = Math.min(sx + w, o.x + o.w);
      var onRight = Math.abs(sx - (o.x + o.w)) < 0.5, onLeft = Math.abs(sx + w - o.x) < 0.5;
      var below = Math.abs(sy - (o.y + o.h)) < 0.5, above = Math.abs(sy + h - o.y) < 0.5;
      if (y1 - y0 > 2 && (onRight || onLeft)) {
        if (o.dock === 'top' || o.dock === 'bottom') {
          var szh = this.sizeFor('h');
          dockTo = { edge: o.dock, along: onRight ? o.x + o.w : o.x - szh.w };
          return;
        }
        var lx = onRight ? sx : sx + w;
        cl = 'left: ' + (lx - 1.5) + 'px; top: ' + y0 + 'px; width: 3px; height: ' + (y1 - y0) + 'px;';
      } else if (x1 - x0 > 2 && (below || above)) {
        if (o.dock === 'left' || o.dock === 'right') {
          var szv = this.sizeFor('v');
          dockTo = { edge: o.dock, along: below ? o.y + o.h : o.y - szv.h };
          return;
        }
        var ly = below ? sy : sy + h;
        cl = 'left: ' + x0 + 'px; top: ' + (ly - 1.5) + 'px; width: ' + (x1 - x0) + 'px; height: 3px;';
      }
    });
    if (dockTo) {
      var dl = {
        top: 'left: 0; top: 0; width: 100%; height: 3px;',
        bottom: 'left: 0; bottom: 0; width: 100%; height: 3px;',
        left: 'left: 0; top: 0; width: 3px; height: 100%;',
        right: 'right: 0; top: 0; width: 3px; height: 100%;'
      }[dockTo.edge];
      return { dock: dockTo.edge, along: Math.max(0, dockTo.along), x: sx, y: sy, line: dl };
    }
    return { dock: null, x: sx, y: sy, line: cl };
  }

  /* ---------- étages ---------- */
  onRowsDown(id, e) {
    if (e.button !== 0 || !this.ws) return;
    e.preventDefault(); e.stopPropagation();
    var b = this.state.bars.find((x) => x.id === id);
    var orient = this.orientOf(b);
    var sign = (b.dock === 'bottom' || b.dock === 'right') ? -1 : 1;
    this.resize = { id: id, start: b.rows || 1, axis: orient === 'h' ? 'y' : 'x', sign: sign, x0: e.clientX, y0: e.clientY, max: Math.max(1, b.icons.length) };
  }

  /* ---------- icône : déplacement ---------- */
  onIconDown(barId, iconId, e) {
    if (e.button !== 0 || !this.ws) return;
    e.preventDefault();
    this.pending = { barId: barId, iconId: iconId, sx: e.clientX, sy: e.clientY, started: false };
  }

  dropTarget(cx, cy) {
    var el = document.elementFromPoint(cx, cy);
    var bar = el && el.closest ? el.closest('[data-bar-id]') : null;
    if (!bar || !this.ws.contains(bar)) return null;
    var v = bar.getAttribute('data-orient') === 'v';
    var idx = 0;
    bar.querySelectorAll('[data-item-id]').forEach((ic) => {
      var r = ic.getBoundingClientRect();
      var after = v
        ? (cx > r.right + 2 || (cx >= r.left - 2 && cy > r.top + r.height / 2))
        : (cy > r.bottom + 2 || (cy >= r.top - 2 && cx > r.left + r.width / 2));
      if (after) idx++;
    });
    return { barId: bar.getAttribute('data-bar-id'), index: idx };
  }

  /* ---------- pointeur global ---------- */
  onMove(e) {
    if (this.drag) {
      var g = this.geom();
      var p = this.local(g, e.clientX, e.clientY);
      var snap = this.computeSnap(p.x - this.drag.offX, p.y - this.drag.offY);
      this.drag.snap = snap;
      this.setState({ drag: { id: this.drag.id, dock: snap.dock, along: snap.along, x: snap.x, y: snap.y }, snapLine: snap.line });
      return;
    }
    if (this.wresize) {
      var wr = this.wresize, gw = this.geom();
      var nw = Math.round(clamp(wr.w0 + (e.clientX - wr.x0) / gw.s, wr.min, 520));
      if ((this.state.widths[wr.id] ?? wr.w0) !== nw) {
        var ws = Object.assign({}, this.state.widths); ws[wr.id] = nw;
        this.setState({ widths: ws, status: wr.label + ' : largeur ' + nw + ' px' });
      }
      return;
    }
    if (this.resize) {
      var rz = this.resize, g3 = this.geom();
      var delta = (rz.axis === 'y' ? e.clientY - rz.y0 : e.clientX - rz.x0) / g3.s * rz.sign;
      var rows = clamp(rz.start + Math.round(delta / CELL), 1, rz.max);
      var cur = this.state.bars.find((x) => x.id === rz.id);
      if (cur && cur.rows !== rows) {
        this.setState({ bars: this.state.bars.map((x) => x.id === rz.id ? Object.assign({}, x, { rows: rows }) : x), status: '« ' + cur.title + ' » : ' + rows + ' étage' + (rows > 1 ? 's' : '') });
      }
      return;
    }
    var pd = this.pending;
    if (pd) {
      if (!pd.started && Math.hypot(e.clientX - pd.sx, e.clientY - pd.sy) < 4) return;
      pd.started = true;
      var g2 = this.geom();
      var q = this.local(g2, e.clientX, e.clientY);
      this.setState({ iconDrag: { iconId: pd.iconId, fromBar: pd.barId, x: q.x, y: q.y, target: this.dropTarget(e.clientX, e.clientY) } });
    }
  }

  onUp(e) {
    if (this.wresize) { this.wresize = null; return; }
    if (this.resize) { this.resize = null; return; }
    if (this.drag) {
      var d = this.drag, snap = d.snap;
      this.drag = null;
      var bars = this.state.bars.slice();
      var i = bars.findIndex((b) => b.id === d.id);
      var b = Object.assign({}, bars[i]);
      if (snap) {
        if (snap.dock) {
          b.dock = snap.dock;
          b.orient = this.dockOrient(snap.dock);
          if (snap.dock === 'top' || snap.dock === 'bottom') { b.x = snap.along; b.y = 0; } else { b.y = snap.along; b.x = 0; }
        } else {
          b.dock = null; b.orient = d.orient; b.x = snap.x; b.y = snap.y;
        }
      }
      bars.splice(i, 1); bars.push(b);
      var msg = snap ? (b.dock ? '« ' + b.title + ' » clipsée ' + EDGE_FR[b.dock] : '« ' + b.title + ' » flottante') : this.state.status;
      this.setState({ bars: bars, drag: null, snapLine: null, status: msg });
      return;
    }
    var pd = this.pending;
    if (pd) {
      this.pending = null;
      if (!pd.started) {
        if (ICONS[pd.iconId]) this.setState({ active: pd.iconId, status: 'Outil : ' + ICONS[pd.iconId].label });
        return;
      }
      var g = this.geom();
      var p = this.local(g, e.clientX, e.clientY);
      var target = this.dropTarget(e.clientX, e.clientY);
      var nextId = this.state.nextId;
      var bars2 = this.state.bars.map((x) => Object.assign({}, x, { icons: x.icons.filter((ic) => !(x.id === pd.barId && ic === pd.iconId)) }));
      var status;
      if (target) {
        var t = bars2.find((x) => x.id === target.barId);
        t.icons.splice(Math.min(target.index, t.icons.length), 0, pd.iconId);
        status = itemOf(pd.iconId).label + ' → « ' + t.title + ' »';
      } else {
        var nb = { id: 'b' + nextId, title: 'Barre ' + nextId, icons: [pd.iconId], rows: 1, dock: null, orient: 'h',
          x: clamp(p.x - 24, 0, g.W - 60), y: clamp(p.y - 20, 0, g.H - 64) };
        nextId++;
        bars2.push(nb);
        status = 'Nouvelle barre « ' + nb.title + ' » — Ctrl+clic sur son titre pour la renommer';
      }
      var removed = bars2.filter((x) => x.icons.length === 0);
      bars2 = bars2.filter((x) => x.icons.length > 0).map((x) => Object.assign({}, x, { rows: Math.min(x.rows || 1, x.icons.length) }));
      if (removed.length) status += ' · « ' + removed[0].title + ' » vide, supprimée';
      this.setState({ bars: bars2, iconDrag: null, nextId: nextId, status: status });
    }
  }

  /* ---------- titre ---------- */
  onTitleClick(id, e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    var b = this.state.bars.find((x) => x.id === id);
    this.setState({ editing: id, draft: b.title });
  }
  toggleOrient(id) {
    var bars = this.state.bars.map((b) => (b.id === id && !b.dock) ? Object.assign({}, b, { orient: b.orient === 'h' ? 'v' : 'h' }) : b);
    this.setState({ bars: bars });
  }
  commitTitle() {
    if (!this.state.editing) return;
    var id = this.state.editing, v = this.state.draft.trim();
    var bars = this.state.bars.map((b) => (b.id === id && v) ? Object.assign({}, b, { title: v }) : b);
    this.setState({ bars: bars, editing: null, status: v ? 'Barre renommée « ' + v + ' »' : this.state.status });
  }

  renderVals() {
    var s = this.state;
    var accent = this.props.accent ?? '#2f81f7';
    var R = this.props.radius ?? 8;
    var idr = s.iconDrag;
    var bars = s.bars.map((b, i) => {
      var dragging = s.drag && s.drag.id === b.id;
      var dock = dragging ? s.drag.dock : b.dock;
      var orient = dock ? this.dockOrient(dock) : (dragging && this.drag ? this.drag.orient : b.orient);
      var x = dragging ? (dock ? s.drag.along : s.drag.x) : b.x;
      var y = dragging ? (dock ? s.drag.along : s.drag.y) : b.y;
      var pos;
      if (dock === 'top') pos = 'left: ' + x + 'px; top: 0;';
      else if (dock === 'bottom') pos = 'left: ' + x + 'px; bottom: 0;';
      else if (dock === 'left') pos = 'left: 0; top: ' + y + 'px;';
      else if (dock === 'right') pos = 'right: 0; top: ' + y + 'px;';
      else pos = 'left: ' + x + 'px; top: ' + y + 'px;';

      var t = s.touch[b.id] || {};
      var c = (q) => q ? 0 : R;
      var radius = c(t.tl) + 'px ' + c(t.tr) + 'px ' + c(t.br) + 'px ' + c(t.bl) + 'px';

      var items = b.icons
        .filter((ic) => !(idr && ic === idr.iconId && b.id === idr.fromBar))
        .map((ic) => {
          var d = itemOf(ic);
          var base = { slot: false, id: ic, label: d.label, isIcon: d.kind === 'icon', isSlider: d.kind === 'slider',
            isInput: d.kind === 'input', isSelect: d.kind === 'select', down: (e) => this.onIconDown(b.id, ic, e) };
          if (d.kind === 'icon') {
            var on = s.active === ic;
            return Object.assign(base, { d: d.d, color: d.color,
              bg: on ? accent + '33' : 'transparent', border: on ? accent : 'transparent' });
          }
          var val = s.values[ic];
          return Object.assign(base, {
            value: val, min: d.min, max: d.max, step: d.step, options: d.options, placeholder: d.placeholder || '',
            display: d.kind === 'slider' ? val + ' ' + d.unit : '',
            change: (e) => {
              var nv = d.kind === 'slider' ? Number(e.target.value) : e.target.value;
              var vals = Object.assign({}, this.state.values); vals[ic] = nv;
              this.setState({ values: vals, status: d.label + ' : ' + nv + (d.unit ? ' ' + d.unit : '') });
            },
            stopKey: (e) => e.stopPropagation(),
            w: s.widths[ic] ?? d.w,
            widthDown: (e) => {
              if (e.button !== 0 || !this.ws) return;
              e.preventDefault(); e.stopPropagation();
              this.wresize = { id: ic, label: d.label, x0: e.clientX, w0: s.widths[ic] ?? d.w, min: d.minW || 120 };
            }
          });
        });
      var isTarget = idr && idr.target && idr.target.barId === b.id;
      if (isTarget) items.splice(Math.min(idr.target.index, items.length), 0, { slot: true, w: s.widths[idr.iconId] ?? itemOf(idr.iconId).w });

      // étages : répartition en lignes (barre horizontale) ou en colonnes (barre verticale)
      var rows = Math.max(1, Math.min(b.rows || 1, Math.max(1, items.length)));
      var per = Math.max(1, Math.ceil(items.length / rows));
      var lanes = [];
      for (var k = 0; k < items.length; k += per) lanes.push({ items: items.slice(k, k + per) });
      if (!lanes.length) lanes.push({ items: [] });

      var handleFirst = dock === 'bottom' || dock === 'right';
      var handleStyle = (orient === 'h'
        ? 'height: 8px; align-self: stretch; cursor: ns-resize;'
        : 'width: 8px; align-self: stretch; cursor: ew-resize;') + (handleFirst ? ' order: -1;' : '');
      var handleMark = orient === 'h' ? 'width: 18px; height: 2px;' : 'width: 2px; height: 18px;';

      var editing = s.editing === b.id;
      return {
        id: b.id, title: b.title, orient: orient, pos: pos, radius: radius, lanes: lanes,
        laneDir: orient === 'h' ? 'column' : 'row',
        itemDir: orient === 'h' ? 'row' : 'column',
        handleStyle: handleStyle, handleMark: handleMark,
        dir: orient === 'h' ? 'column' : 'row',
        titleStyle: orient === 'h'
          ? 'padding: 6px 8px 0 6px; writing-mode: horizontal-tb;'
          : 'padding: 8px 0 6px 6px; writing-mode: vertical-rl; transform: rotate(180deg);',
        border: (function () {
          var col = isTarget ? accent : (dragging ? '#484f58' : '#30363d');
          // côté partagé avec une autre barre : une seule bordure de 1 px (celle de la voisine)
          var tc = (f) => f ? 'transparent' : col;
          return col + '; border-color: ' + tc(t.nt) + ' ' + tc(t.nr) + ' ' + tc(t.nb) + ' ' + tc(t.nl);
        })(),
        shadow: dragging ? '0 12px 32px rgba(0,0,0,0.55)' : (dock ? 'none' : '0 6px 18px rgba(0,0,0,0.35)'),
        opacity: dragging ? 0.94 : 1,
        z: dragging ? 30 : 10 + i,
        editing: editing, notEditing: !editing,
        down: (e) => this.onBarDown(b.id, e),
        rowsDown: (e) => this.onRowsDown(b.id, e),
        titleClick: (e) => this.onTitleClick(b.id, e),
        dbl: () => this.toggleOrient(b.id)
      };
    });
    var ghost = null;
    if (idr) {
      var gi = itemOf(idr.iconId);
      ghost = { pos: 'left: ' + (idr.x - 17) + 'px; top: ' + (idr.y - 17) + 'px;', d: gi.d || '', color: gi.color || '#e6edf3',
        isIcon: gi.kind === 'icon', isControl: gi.kind !== 'icon', label: gi.label, kindLabel: KIND_FR[gi.kind] || '',
        newBar: !idr.target };
    }
    return {
      accent: accent,
      bars: bars,
      ghost: ghost,
      snapLine: s.snapLine,
      status: s.status,
      draft: s.draft,
      wsRef: this.wsRef,
      focusRef: this.focusRef,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onDraftKey: (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') this.commitTitle();
        else if (e.key === 'Escape') this.setState({ editing: null });
      },
      commitTitle: () => this.commitTitle()
    };
  }
}
</script>
</body>
